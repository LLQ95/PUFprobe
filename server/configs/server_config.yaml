# Central configuration for running PUFprobe on the server
#
# This file is also a bash-sourceable key=value file; every script under
# server/ loads it automatically. Every variable can be overridden with an
# environment variable before invoking a script, e.g.:
#   THREADS=64 TIER=B bash server/01_download_dbs.sh
#
# Each value is written as ${VAR:-default} so that a variable already set in
# the environment is preserved when the file is sourced; the built-in value is
# only a default.
#
# Sync root: /data/liushiwei/PUFprobe (the scripts derive the repository root
# automatically, so it does not need to be set here)

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
PUFPROBE_ENV="${PUFPROBE_ENV:-pufprobe}"          # Dedicated conda environment to create; existing ones are left untouched
PYTHON_VERSION="${PYTHON_VERSION:-3.11}"
THREADS="${THREADS:-$(nproc 2>/dev/null || echo 8)}"   # Threads for external tools
LOG_DIR="${LOG_DIR:-$REPO_ROOT/server/logs}"

# Mirrors (use the upstream sources on a server outside China)
CONDA_MIRROR_HOST="${CONDA_MIRROR_HOST:-https://mirrors.tuna.tsinghua.edu.cn/anaconda}"   # Alternative: https://mirrors.bfsu.edu.cn/anaconda
PIP_INDEX_URL="${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"            # Alternative: https://mirrors.aliyun.com/pypi/simple
# Torch wheels are tried in order by 00_setup_env.sh (GPU: Aliyun -> SJTU ->
# official cu121; CPU likewise), so they usually need no manual setup. With a
# special network, export before running, e.g.:
#   export TORCH_INDEX_URL_GPU=https://mirrors.aliyun.com/pytorch-wheels/cu121/
TORCH_INDEX_URL_GPU="${TORCH_INDEX_URL_GPU:-https://mirrors.aliyun.com/pytorch-wheels/cu121/}"
TORCH_INDEX_URL_CPU="${TORCH_INDEX_URL_CPU:-https://mirrors.aliyun.com/pytorch-wheels/cpu/}"
# Portable P2Rank version (bioconda does not provide p2rank; the script
# downloads it from the GitHub release)
P2RANK_VERSION="${P2RANK_VERSION:-2.5.1}"

# ---------------------------------------------------------------------------
# Existing environments (never modified; only invoked through conda run)
# ---------------------------------------------------------------------------
BAKTA_ENV="${BAKTA_ENV:-bakta_env}"            # bakta 1.12.0
BAKTA_DB="${BAKTA_DB:-/db/student/metagenome/bakta_db/db}"
PROKKA_ENV="${PROKKA_ENV:-checkm}"              # prokka 1.15.6 lives in this environment
PROKKA_KINGDOM="${PROKKA_KINGDOM:-Bacteria}"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
# Contigs directory: must be set to the real path before use (one FASTA file per strain)
CONTIGS_DIR="${CONTIGS_DIR:-}"
CONTIG_EXTENSIONS="${CONTIG_EXTENSIONS:-fna fa fasta fas}"
ANNOT_ROOT="${ANNOT_ROOT:-$REPO_ROOT/annotations}"
RUNS_ROOT="${RUNS_ROOT:-$REPO_ROOT/runs}"
RESULTS_DIR="${RESULTS_DIR:-$REPO_ROOT/results}"

# Databases
DB_ROOT="${DB_ROOT:-/data/liushiwei/PUFprobe/dbs}"
# UniProt reference FASTA root (used to build the MMseqs2 database when the
# built-in downloader fails; switch to a mirror when the official host is slow)
UNIPROT_BASE="${UNIPROT_BASE:-https://ftp.uniprot.org/pub/databases/uniprot/current_release}"
DBDIR="${DBDIR:-$DB_ROOT/dbdir}"        # Directory holding the mmseqs/foldseek/hhblits database prefixes
CARD_FA="${CARD_FA:-$DB_ROOT/card/protein_fasta_protein_homolog_model.fasta}"
VFDB_FA="${VFDB_FA:-$DB_ROOT/vfdb/VFDB_setA_pro.fas}"
TORCH_HOME="${TORCH_HOME:-$DB_ROOT/torch_cache}"
MMSEQS_TMP="${MMSEQS_TMP:-$DB_ROOT/tmp}"

# ---------------------------------------------------------------------------
# 02_annotate.sh
# ---------------------------------------------------------------------------
RUN_BAKTA="${RUN_BAKTA:-1}"                    # 1 runs bakta, 0 skips
RUN_PROKKA="${RUN_PROKKA:-1}"                   # 1 runs prokka, 0 skips
ANNOT_JOBS="${ANNOT_JOBS:-2}"                   # Number of strains annotated in parallel (each strain is still multi-threaded)
ANNOT_THREADS="${ANNOT_THREADS:-8}"                # bakta/prokka threads per strain
MAX_SAMPLES="${MAX_SAMPLES:-0}"                  # >0 processes only the first N strains (3 recommended for smoke); 0 means all

# ---------------------------------------------------------------------------
# 01_download_dbs.sh
# ---------------------------------------------------------------------------
TIER="${TIER:-A}"                         # A=small smoke databases (run first), B=full databases
# Tier A structure database: PDB is the smallest official foldseek database
# (~10-15 GB); set to 0 when disk is tight and the foldseek channel is skipped
# automatically when no database is found.
SMOKE_FOLDSEEK="${SMOKE_FOLDSEEK:-1}"
SMOKE_HHBLITS="${SMOKE_HHBLITS:-0}"                # 1 also downloads PDB70 (several GB); usually not needed for smoke
# Tier B
FULL_FOLDSEEK_DB="${FULL_FOLDSEEK_DB:-Alphafold/Proteome}"   # Full structure database; Alphafold/UniProt is more complete but larger
UNIREF30_RELEASE="${UNIREF30_RELEASE:-2023_02}"
DOWNLOAD_BFD="${DOWNLOAD_BFD:-0}"                 # 1 downloads BFD (~1.8 TB unpacked; not downloaded by default)
WGET_TRIES="${WGET_TRIES:-5}"

# ---------------------------------------------------------------------------
# 03_run_pufprobe.sh
# ---------------------------------------------------------------------------
BATCH_NAME="${BATCH_NAME:-salmonella}"
ANNOTATION_SOURCE="${ANNOTATION_SOURCE:-bakta}"        # bakta or prokka; each source runs in its own working directory
ESM_BATCH_SIZE="${ESM_BATCH_SIZE:-8}"
MIN_PLDDT="${MIN_PLDDT:-70}"
HIGH_CONFIDENCE="${HIGH_CONFIDENCE:-0.80}"
MIN_CONFIDENCE_ANNOTATE="${MIN_CONFIDENCE_ANNOTATE:-0.80}"
# Without a GPU: 1=run the small 35M model on CPU (slow), 0=use sequence
# feature fallback (fastest for smoke)
USE_CPU_ESM="${USE_CPU_ESM:-0}"
# Force no deep models for smoke: 1 fastest; 0 selects automatically by GPU/CPU detection
FORCE_FALLBACK="${FORCE_FALLBACK:-1}"
# Whether to run ESMFold on CPU (very slow, default 0; the structure channel is
# skipped automatically without a GPU)
FOLD_ON_CPU="${FOLD_ON_CPU:-0}"
WETLAB_TOP_N="${WETLAB_TOP_N:-30}"

# ---------------------------------------------------------------------------
# Cross-species expansion (07_* ... 11_*)
# ---------------------------------------------------------------------------
# Root of the cross-species hypothetical-protein dataset and all downstream
# families, embeddings, structures and networks.
CROSS_SPECIES_ROOT="${CROSS_SPECIES_ROOT:-$DB_ROOT/cross_species}"
# 08_embed_cluster.sh — MMseqs2 linear-time family clustering (linclust)
CS_MIN_SEQ_ID="${CS_MIN_SEQ_ID:-0.30}"          # family-level identity floor (linclust floor ~0.27)
CS_COVERAGE="${CS_COVERAGE:-0.80}"              # bidirectional alignment coverage
CS_COV_MODE="${CS_COV_MODE:-0}"                 # 0 = bidirectional coverage
CS_CLUSTER_MODE="${CS_CLUSTER_MODE:-1}"         # 1 = connected component (greedy set-cover)
# ESM-2 embeddings are computed only for family representatives, keeping the
# GPU cost proportional to the number of families rather than proteins.
CS_EMBED_MODEL="${CS_EMBED_MODEL:-esm2_t33_650M_UR50D}"
CS_EMBED_BATCH="${CS_EMBED_BATCH:-16}"
CS_EMBED_REPRESENTATIVES="${CS_EMBED_REPRESENTATIVES:-1}"   # 1 embed representatives, 0 skip
# 09_fetch_alphafold.sh — precomputed structures for family representatives
CS_ALPHAFOLD_DIR="${CS_ALPHAFOLD_DIR:-$CROSS_SPECIES_ROOT/structures}"
CS_FOLDSEEK_STRUCT_EVALUE="${CS_FOLDSEEK_STRUCT_EVALUE:-10}"
CS_FOLDSEEK_TM="${CS_FOLDSEEK_TM:-0.50}"
CS_ESMFOLD_FALLBACK="${CS_ESMFOLD_FALLBACK:-1}"   # 1 fold AF-missing reps with ESMFold, 0 leave them
CS_WORKERS="${CS_WORKERS:-8}"                     # parallel AlphaFold downloads
CS_MAX_REPS="${CS_MAX_REPS:-0}"                   # >0 limits representatives (smoke test)
# Optional ProstT5 structure-aware embeddings (needs transformers + GPU); these
# add a database-free structural representation and are kept separate from the
# ESM-2 embeddings so the network stage can combine them.
CS_PROSTT5="${CS_PROSTT5:-0}"
CS_PROSTT5_MODEL="${CS_PROSTT5_MODEL:-Rostlab/ProstT5_fp16}"
CS_PROSTT5_BATCH="${CS_PROSTT5_BATCH:-8}"
# 10_build_network.sh — family-level kNN graph and community detection
CS_NETWORK_K="${CS_NETWORK_K:-12}"              # kNN edges from representative embeddings
CS_LEIDEN_RESOLUTION="${CS_LEIDEN_RESOLUTION:-1.0}"
CS_LEIDEN_SEED="${CS_LEIDEN_SEED:-42}"
CS_CORE_MIN_SIZE="${CS_CORE_MIN_SIZE:-2}"          # detail plot keeps families with >= this many members
# 11_baseline_compare.sh — held-out annotation gain benchmark
CS_BENCHMARK_SAMPLE="${CS_BENCHMARK_SAMPLE:-20000}"         # Swiss-Prot hold-out sample size
CS_BENCHMARK_PAGES="${CS_BENCHMARK_PAGES:-120}"             # UniProt pages scanned to reach the quota
# CS_NO_STRUCTURES=1 limits 11 to the sequence channel (no AlphaFold/Foldseek)

# ---------------------------------------------------------------------------
# Evidence-channel databases (12_download_evidence_dbs.sh)
# ---------------------------------------------------------------------------
# Auxiliary fusion-channel databases live on the data volume next to the
# eggNOG 7 databases: the repo disk on /data is too small for the ~200 GB
# unpacked UniRef30 hhsuite build.
EVIDENCE_DB_ROOT="${EVIDENCE_DB_ROOT:-/db/student/metagenome/evidence_dbs}"
# STRING version for the DATABASE-corroboration channel.
STRING_VER="${STRING_VER:-12.5}"
# Space-separated NCBI taxids for per-species STRING networks. Override for
# your panel, or set STRING_TAXIDS_FILE to a newline-separated list (e.g.
# extracted from the 07 proteomes index).
# NOTE: STRING builds networks for specific strain-level reference proteomes,
# not species/genus-level taxids (e.g. use 99287 S. Typhimurium, not 28901
# S. enterica; use 511145 E. coli K12, not 562). The defaults below are all
# verified present in v12.5 and cover PUFprobe's target pathogens.
STRING_TAXIDS="${STRING_TAXIDS:-99287 511145 386585 272620 584 35703 300267 169963 214092 243277 192222 226185 93061 208964 400668}"
STRING_TAXIDS_FILE="${STRING_TAXIDS_FILE:-}"
# 1 also downloads the global protein.aliases table (~3.2 GB) for accession
# to STRING-id mapping; the COG-level links and per-species files work without it.
STRING_WITH_ALIASES="${STRING_WITH_ALIASES:-0}"
# 1 also downloads the GOA reference-proteome GAF (~23 GB gz) for BPO model
# training; go-basic.obo alone is sufficient for true-path propagation.
WITH_GOA="${WITH_GOA:-0}"
# UniRef30 hhsuite release used by the HHblits remote-homology channel.
EVIDENCE_UNIREF30_RELEASE="${EVIDENCE_UNIREF30_RELEASE:-2023_02}"

